<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/cadAdm.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/PROJETOMILIONARIO/Restaurante-etec/assets/img/android-chrome-192x192.png">
    <title>Sabor Vivo</title>
</head>
<body>
    <div class="painel">

        <header>
            <p class="cadastro">Cadastro</p>
            <p class="acesso-adm">Acesso Administrativo</p>
            <hr class="linhaA">
            <h1 class="titulo">Sabor Vivo</h1>
        </header>

        <main>
          <form class="formulario">
                <input type="text" placeholder="Nome Completo: ">

                <input type="text" name="cpf" inputmode="numeric" maxlength="14" placeholder="CPF: ">

                <input type="email" placeholder="E-mail: ">

                <input type="password" placeholder="Senha: ">
                <button class="button" type="button">CADASTRAR</button>
          </form>
        </main><br>

        <footer>
        </footer>
    </div>
    
                <div class="mensagens-sistema">

                    <div class="card-mensagem">
                        <div class="icone-sucesso">✓</div>

                        <h3>Sucesso!</h3>

                        <p>Cadastro  feito com sucesso no sistema.</p>

                        <button class="btn-sucesso">Continuar</button>
                    </div>

                    <div class="card-mensagem">
                        <div class="icone-erro">✕</div>

                        <h3>Erro!</h3>

                        <p>Não foi possível salvar os dados.</p>

                        <button class="btn-erro">Tentar novamente</button>
                    </div>
                </div>

</body>
